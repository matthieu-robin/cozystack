{{- $policy := .Values.admissionWebhookPolicy | default dict -}}
{{- $inc := index .Values "ingress-nginx" | default dict -}}
{{- $ingress := index .Subcharts "ingress-nginx" -}}
{{- $admissionWebhooks := dig "controller" "admissionWebhooks" dict $inc | default dict -}}
{{- if and (dig "enabled" true $policy) (dig "enabled" true $admissionWebhooks) (.Capabilities.APIVersions.Has "cilium.io/v2/CiliumClusterwideNetworkPolicy") }}
{{- $controllerName := include "ingress-nginx.name" $ingress -}}
{{- $controllerNamespace := include "ingress-nginx.namespace" $ingress -}}
{{- $webhookPort := dig "port" 8443 $admissionWebhooks -}}
{{- $policyHash := printf "%s/%s" $controllerNamespace .Release.Name | sha256sum | trunc 12 -}}
---
{{/*
The ingress-nginx admission webhook only needs to be reachable by the API
server. Leaving it reachable from every pod is avoidable attack surface: any
flaw in the webhook then becomes exploitable by any workload in any
namespace, which is what made CVE-2025-1974 (IngressNightmare) critical
rather than merely serious.

This is deliberately source-side. A target-side ingress policy with a
cluster-wide fromEndpoints selector makes every namespace identity part of
the webhook endpoint's own policy, so every namespace create or delete
recomputes a selector attached to the fail-closed endpoint. Selecting callers
instead keeps the namespace-wide selector on source endpoints, where a
recomputation cannot take admission down.

Stated precisely, because #3983 was reported as a hard outage rather than a
flap: that coupling is structural and is removed here, but it was not
reproduced in isolation as the trigger, and the world deny below -- the other
candidate named in the issue -- is retained on the evidence quoted at the end
of this comment. The source-side form is the better shape either way, and
hack/e2e-chainsaw/gateway/chainsaw-test.yaml now covers both the availability
and the deny it is supposed to provide.

Only the BACKEND port is denied, and that is sufficient rather than an
oversight. Cilium translates a service to its backends BEFORE egress policy
is enforced, so a pod dialling the admission Service's ClusterIP:443 is
matched against the backend identity on port 8443 -- the rule below. Do not
reach for `toServices` to cover the ClusterIP explicitly: Cilium resolves
`toServices` only inside ALLOW rules (pkg/policy/k8s/service.go walks
spec.Egress and never spec.EgressDeny), and an egressDeny whose only
destination is an unresolved `toServices` reaches the datapath with a
non-nil-but-empty L3 selector, which Cilium reads as a WILDCARD when the rule
carries toPorts (pkg/policy/types/policyentry.go). Such a rule denies every
destination on that port for every selected endpoint -- a cluster-wide
egress outage, not a tighter deny.

That ordering is Cilium's own, and it is conditional: it holds while Cilium owns
service load-balancing, which on every cozystack variant it does because
packages/system/cilium/values.yaml sets kubeProxyReplacement: true against an
upstream chart default of "false". Set that false and the ClusterIP DNAT moves
downstream of Cilium's egress hook (kube-proxy in the host netns, or kube-ovn's
OVN load balancer): the packet reaches policy_can_egress4 with dst = ClusterIP,
matches no endpoint identity, and -- default-deny being off -- is allowed. Pods
regain <admission>.<ns>.svc:443 while the backend deny below keeps working, and
nothing reports the change.

Two things keep that from happening quietly.
packages/system/cilium/tests/kube_proxy_replacement_test.yaml pins the value
across the chart defaults and all five variant valuesFiles combinations, so
flipping it reddens the cilium package's own suite; it also carries the full
argument, including why a target-side ingressDeny cannot be re-added here as a
fallback (its peer selector is what carries namespace churn, and the one
churn-free peer is a wildcard that would deny the API server too). And the
deny-still-enforced case in hack/e2e-chainsaw/gateway/chainsaw-test.yaml
connects to the admission ClusterIP from a pod and requires that connect to
fail, so the effect is asserted against a live cluster rather than only reasoned
about here.

The first rule covers every workload outside kube-system. The second covers
kube-system except the konnectivity-agent ServiceAccount: a Kamaji-hosted
tenant cluster reaches in-cluster webhooks through that pod, and Kamaji sets
the ServiceAccount name from the same constant as the pod's k8s-app label
(internal/resources/konnectivity/agent.go). Keying the exemption on the
ServiceAccount matters: `k8s-app` is an ordinary pod label any workload can
set on itself, and because these rules disable default-deny, falling out of
the deny IS the whole access decision. Cilium derives
io.cilium.k8s.policy.serviceaccount from the pod's actual ServiceAccount, so
it cannot be forged with a label.

The final rule keeps the external-world deny on the webhook endpoint. Its
caller selector is a static reserved entity rather than a cluster-wide
endpoint set, so it does not recreate the churn failure mode. It is retained
rather than relied upon for the API server: on a kube-ovn chained datapath
the API server's connection arrives with identity `host` (same node) or
`kube-apiserver` (another node), never `world` -- observed with `cilium
monitor` on a live kube-ovn cluster while the equivalent kubeovn-webhook
policy was in place.
*/}}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ingress-nginx-admission-webhook-{{ $policyHash }}
specs:
- endpointSelector:
    matchExpressions:
    - key: k8s:io.kubernetes.pod.namespace
      operator: NotIn
      values:
      - kube-system
  enableDefaultDeny:
    ingress: false
    egress: false
  egressDeny:
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": {{ $controllerNamespace | quote }}
        "k8s:app.kubernetes.io/name": {{ $controllerName | quote }}
        "k8s:app.kubernetes.io/instance": {{ .Release.Name | quote }}
        "k8s:app.kubernetes.io/component": controller
    toPorts:
    - ports:
      - port: {{ $webhookPort | quote }}
        protocol: TCP
- endpointSelector:
    matchExpressions:
    - key: k8s:io.kubernetes.pod.namespace
      operator: In
      values:
      - kube-system
    - key: io.cilium.k8s.policy.serviceaccount
      operator: NotIn
      values:
      - konnectivity-agent
  enableDefaultDeny:
    ingress: false
    egress: false
  egressDeny:
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": {{ $controllerNamespace | quote }}
        "k8s:app.kubernetes.io/name": {{ $controllerName | quote }}
        "k8s:app.kubernetes.io/instance": {{ .Release.Name | quote }}
        "k8s:app.kubernetes.io/component": controller
    toPorts:
    - ports:
      - port: {{ $webhookPort | quote }}
        protocol: TCP
- endpointSelector:
    matchLabels:
      "k8s:io.kubernetes.pod.namespace": {{ $controllerNamespace | quote }}
      "k8s:app.kubernetes.io/name": {{ $controllerName | quote }}
      "k8s:app.kubernetes.io/instance": {{ .Release.Name | quote }}
      "k8s:app.kubernetes.io/component": controller
  enableDefaultDeny:
    ingress: false
    egress: false
  ingressDeny:
  - fromEntities:
    - world
    toPorts:
    - ports:
      - port: {{ $webhookPort | quote }}
        protocol: TCP
{{- end }}
