{{- $policy := .Values.admissionWebhookPolicy | default dict -}}
{{- $inc := index .Values "ingress-nginx" | default dict -}}
{{- $ingress := index .Subcharts "ingress-nginx" -}}
{{- $admissionWebhooks := dig "controller" "admissionWebhooks" dict $inc | default dict -}}
{{- if and (dig "enabled" true $policy) (dig "enabled" true $admissionWebhooks) (.Capabilities.APIVersions.Has "cilium.io/v2/CiliumClusterwideNetworkPolicy") }}
{{- $controllerName := include "ingress-nginx.name" $ingress -}}
{{- $controllerNamespace := include "ingress-nginx.namespace" $ingress -}}
{{- $controllerFullname := include "ingress-nginx.controller.fullname" $ingress -}}
{{- $webhookServiceName := printf "%s-admission" $controllerFullname -}}
{{- $webhookPort := dig "port" 8443 $admissionWebhooks -}}
{{- $webhookServicePort := dig "service" "servicePort" 443 $admissionWebhooks -}}
{{- $policyHash := printf "%s/%s" $controllerNamespace .Release.Name | sha256sum | trunc 12 -}}
---
# The ingress-nginx admission webhook only needs to be reachable by the API
# server. Deny pod egress through its exact Service and directly to its exact
# endpoint identity while leaving every other destination and port unchanged.
#
# This is deliberately source-side. A target-side ingress policy with a
# cluster-wide fromEndpoints selector makes every namespace identity part of
# the webhook endpoint's policy. Namespace deletion can then regenerate that
# endpoint and transiently drop legitimate API-server webhook calls (#3983).
# Keeping the namespace-wide selector on source endpoints removes that
# production failure mode while preserving the same pod-to-webhook boundary.
#
# The first rule covers every workload outside kube-system. The second covers
# kube-system except the konnectivity-agent ServiceAccount: Kamaji-hosted API
# servers reach admission webhooks through that pod. The ServiceAccount label
# is a Cilium-derived identity label, so a workload outside kube-system cannot
# forge its way into the exemption with an ordinary pod label.
#
# The final rule keeps the external-world deny on the webhook endpoint. Its
# caller selector is a static entity rather than a cluster-wide endpoint set,
# so it does not couple target regeneration to namespace lifecycle events.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ingress-nginx-admission-webhook-{{ $policyHash }}
specs:
- endpointSelector:
    matchExpressions:
    - key: k8s:io.kubernetes.pod.namespace
      operator: NotIn
      values:
      - kube-system
  enableDefaultDeny:
    ingress: false
    egress: false
  egressDeny:
  - toServices:
    - k8sService:
        namespace: {{ $controllerNamespace | quote }}
        serviceName: {{ $webhookServiceName | quote }}
    toPorts:
    - ports:
      - port: {{ $webhookServicePort | quote }}
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": {{ $controllerNamespace | quote }}
        "k8s:app.kubernetes.io/name": {{ $controllerName | quote }}
        "k8s:app.kubernetes.io/instance": {{ .Release.Name | quote }}
        "k8s:app.kubernetes.io/component": controller
    toPorts:
    - ports:
      - port: {{ $webhookPort | quote }}
        protocol: TCP
- endpointSelector:
    matchExpressions:
    - key: k8s:io.kubernetes.pod.namespace
      operator: In
      values:
      - kube-system
    - key: io.cilium.k8s.policy.serviceaccount
      operator: NotIn
      values:
      - konnectivity-agent
  enableDefaultDeny:
    ingress: false
    egress: false
  egressDeny:
  - toServices:
    - k8sService:
        namespace: {{ $controllerNamespace | quote }}
        serviceName: {{ $webhookServiceName | quote }}
    toPorts:
    - ports:
      - port: {{ $webhookServicePort | quote }}
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": {{ $controllerNamespace | quote }}
        "k8s:app.kubernetes.io/name": {{ $controllerName | quote }}
        "k8s:app.kubernetes.io/instance": {{ .Release.Name | quote }}
        "k8s:app.kubernetes.io/component": controller
    toPorts:
    - ports:
      - port: {{ $webhookPort | quote }}
        protocol: TCP
- endpointSelector:
    matchLabels:
      "k8s:io.kubernetes.pod.namespace": {{ $controllerNamespace | quote }}
      "k8s:app.kubernetes.io/name": {{ $controllerName | quote }}
      "k8s:app.kubernetes.io/instance": {{ .Release.Name | quote }}
      "k8s:app.kubernetes.io/component": controller
  enableDefaultDeny:
    ingress: false
    egress: false
  ingressDeny:
  - fromEntities:
    - world
    toPorts:
    - ports:
      - port: {{ $webhookPort | quote }}
        protocol: TCP
{{- end }}
