suite: cilium owns service load-balancing

# This pins one value, and it is pinned because two other packages depend on it
# in a way that fails OPEN if it is lost. Read this before changing
# kubeProxyReplacement in values.yaml or in any variant values file.
#
# packages/system/ingress-nginx and packages/system/kubeovn-webhook each ship a
# CiliumClusterwideNetworkPolicy that denies pod egress to their admission
# webhook. Both name only the webhook's BACKEND port (8443) and select the
# webhook pods by label; neither names the Service frontend, because Cilium
# cannot express a frontend in a deny rule -- it resolves `toServices` only
# inside allow rules, and an egressDeny whose sole destination is an unresolved
# toServices reaches the datapath as a wildcard, denying every destination on
# that port for every selected pod.
#
# Naming the backend alone still covers a pod dialling the ClusterIP, because
# Cilium translates the service before it enforces egress policy: in Cilium
# v1.19.5, bpf/bpf_lxc.c runs __per_packet_lb_svc_xlate_4 and lb4_local() and
# only then tail-calls CILIUM_CALL_IPV4_FROM_LXC_CONT into handle_ipv4_from_lxc,
# where policy_can_egress4 evaluates the rule. By that point the destination is
# the backend pod on 8443, which is what the rules match.
#
# That ordering exists only while Cilium is the thing doing the DNAT, and the
# only reason it is today is the value asserted below: kubeProxyReplacement,
# "true" here against an upstream chart default of "false". Set it false and the
# ClusterIP DNAT moves downstream of Cilium's egress hook (kube-proxy in the
# host netns, or kube-ovn's OVN load balancer). The packet then reaches
# policy_can_egress4 with dst = ClusterIP, which resolves to no endpoint
# identity and cannot match toEndpoints; both policies run with
# enableDefaultDeny: false, so falling out of the deny IS the access decision
# and the packet is allowed. Every pod regains <webhook>.<ns>.svc:443 while the
# backend-port deny keeps working and nothing reports a change.
#
# Re-adding a target-side ingressDeny on the webhook pods as a second line of
# defence does not work, and that is recorded here because it is the obvious
# next idea. To deny pods, a target-side rule needs a peer selector covering
# them, and the peer selector is what carries namespace churn -- which is the
# failure this whole arrangement was built to remove (#3983):
#
#   * pkg/policy/selectorcache.go, SelectorCache.UpdateIdentities ->
#     updateSelections, which notifies a selector's users only when the churned
#     identities were in ITS cached selections;
#   * pkg/policy/l4.go, L4Filter.IdentitySelectionUpdated -> AccumulateMapChanges,
#     which writes the policy map of every endpoint the rule's endpointSelector
#     selects -- for a target-side rule, the fail-closed webhook pods.
#
# So a cluster-wide non-wildcard peer (`namespace Exists`, or a kube-system
# split) reattaches every namespace identity to the webhook endpoint's own
# policy, which is exactly the shape that was removed. The one churn-free peer
# is the wildcard `{}`: pkg/policy/l4.go collapses it to a single ANY-identity
# map entry and returns early from IdentitySelectionUpdated, so identity churn
# never touches it. But ANY covers the reserved identities too -- host,
# remote-node, kube-apiserver -- so it would deny the API server and stop
# admission cluster-wide. There is no third shape, which is why the dependency
# is pinned here instead of being hedged there.
#
# The other half of the guard is behavioural rather than static: the
# admission-webhook-deny-still-enforced case in
# hack/e2e-chainsaw/gateway/chainsaw-test.yaml connects to the admission
# Service's ClusterIP from a pod and requires the connect to fail, so the effect
# is asserted against a live cluster and not only reasoned about here.
#
# Asserted on the rendered ConfigMap key rather than on .Values, so an upstream
# bump that renames the key or stops honouring our override is caught too --
# that is silent in exactly the same way, and the same argument the
# agent_resources_test.yaml suite next door makes for its own assertions.
#
# One variant per test, spelling out the valuesFiles combination that
# packages/core/platform/sources/networking.yaml actually installs, so a future
# variant file that overrides the value reddens here rather than shipping. Guest
# clusters install this chart with no variant values file at all
# (sources/kubernetes-application.yaml), which the defaults case covers.
release:
  name: cilium
  namespace: cozy-cilium
tests:
  - it: chart defaults keep Cilium in charge of service load-balancing
    template: charts/cilium/templates/cilium-configmap.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: data["kube-proxy-replacement"]
          value: "true"

  - it: the cilium variant keeps it
    template: charts/cilium/templates/cilium-configmap.yaml
    values:
      - ../values-talos.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: data["kube-proxy-replacement"]
          value: "true"

  - it: the cilium-kilo variant keeps it
    template: charts/cilium/templates/cilium-configmap.yaml
    values:
      - ../values-talos.yaml
      - ../values-kilo.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: data["kube-proxy-replacement"]
          value: "true"

  - it: the cilium-generic variant keeps it
    template: charts/cilium/templates/cilium-configmap.yaml
    values:
      - ../values-apparmor.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: data["kube-proxy-replacement"]
          value: "true"

  - it: the kubeovn-cilium variant keeps it
    template: charts/cilium/templates/cilium-configmap.yaml
    values:
      - ../values-talos.yaml
      - ../values-kubeovn.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: data["kube-proxy-replacement"]
          value: "true"

  - it: the kubeovn-cilium-generic variant keeps it
    template: charts/cilium/templates/cilium-configmap.yaml
    values:
      - ../values-apparmor.yaml
      - ../values-kubeovn.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - equal:
          path: data["kube-proxy-replacement"]
          value: "true"
