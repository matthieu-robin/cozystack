{{- $policy := .Values.webhookPolicy | default dict -}}
{{- if and (dig "enabled" true $policy) (.Capabilities.APIVersions.Has "cilium.io/v2/CiliumClusterwideNetworkPolicy") }}
{{- $policyHash := printf "%s/%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 -}}
---
{{/*
The /mutate-pods handler returns namespace-derived annotations to any caller,
and only the API server has any business calling it (GHSA-g883-q79m-8225).
Client-certificate verification cannot enforce that on the stock control plane
because the API server presents no client certificate to this webhook.

This Cilium policy is source-side and deny-only. Selecting callers avoids
coupling the webhook endpoint's ingress policy to every namespace identity:
namespace deletion can otherwise regenerate that endpoint and transiently
break Pod admission (#3983). enableDefaultDeny remains false, so the policy
subtracts only the webhook destination at its frontend and backend ports from
pod egress.

The API server and host-network workloads are not selected as pod endpoints.
This component exists only on the management cluster, so unlike ingress-nginx
there is no konnectivity-tunnelled caller to exempt. A second, target-side rule
keeps the external-world deny; its static entity selector does not depend on
namespace identities and therefore does not recreate the churn failure mode.
*/}}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: kube-ovn-webhook-{{ $policyHash }}
specs:
- endpointSelector: {}
  enableDefaultDeny:
    ingress: false
    egress: false
  egressDeny:
  - toServices:
    - k8sService:
        namespace: {{ .Release.Namespace | quote }}
        serviceName: {{ include "namespace-annotation-webhook.fullname" . | quote }}
    toPorts:
    - ports:
      - port: {{ include "namespace-annotation-webhook.servicePort" . | quote }}
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        "k8s:io.kubernetes.pod.namespace": {{ .Release.Namespace | quote }}
        "k8s:app.kubernetes.io/name": {{ include "namespace-annotation-webhook.name" . | quote }}
        "k8s:app.kubernetes.io/instance": {{ .Release.Name | quote }}
    toPorts:
    - ports:
      - port: {{ include "namespace-annotation-webhook.port" . | quote }}
        protocol: TCP
- endpointSelector:
    matchLabels:
      "k8s:io.kubernetes.pod.namespace": {{ .Release.Namespace | quote }}
      "k8s:app.kubernetes.io/name": {{ include "namespace-annotation-webhook.name" . | quote }}
      "k8s:app.kubernetes.io/instance": {{ .Release.Name | quote }}
  enableDefaultDeny:
    ingress: false
    egress: false
  ingressDeny:
  - fromEntities:
    - world
    toPorts:
    - ports:
      - port: {{ include "namespace-annotation-webhook.port" . | quote }}
        protocol: TCP
{{- end }}
