suite: kubeovn-webhook exposure
release:
  name: kubeovn-webhook
  namespace: cozy-kubeovn
templates:
  - templates/networkpolicy.yaml
capabilities:
  apiVersions:
    - cilium.io/v2/CiliumClusterwideNetworkPolicy
tests:
  - it: denies pod egress through the exact webhook Service
    asserts:
      - isKind:
          of: CiliumClusterwideNetworkPolicy
      - equal:
          path: specs[0].endpointSelector
          value: {}
      - equal:
          path: specs[0].egressDeny[0].toServices[0].k8sService.namespace
          value: cozy-kubeovn
      - equal:
          path: specs[0].egressDeny[0].toServices[0].k8sService.serviceName
          value: kube-ovn-webhook
      - equal:
          path: specs[0].egressDeny[0].toPorts[0].ports[0].port
          value: "443"

  - it: denies direct pod egress to the exact webhook backend and port
    asserts:
      - equal:
          path: specs[0].egressDeny[1].toEndpoints[0].matchLabels["k8s:io.kubernetes.pod.namespace"]
          value: cozy-kubeovn
      - equal:
          path: specs[0].egressDeny[1].toEndpoints[0].matchLabels["k8s:app.kubernetes.io/name"]
          value: kube-ovn-webhook
      - equal:
          path: specs[0].egressDeny[1].toEndpoints[0].matchLabels["k8s:app.kubernetes.io/instance"]
          value: kubeovn-webhook
      - equal:
          path: specs[0].egressDeny[1].toPorts[0].ports[0].port
          value: "8443"
      - equal:
          path: specs[0].egressDeny[1].toPorts[0].ports[0].protocol
          value: TCP

  - it: denies world ingress without a namespace-dependent caller selector
    asserts:
      - equal:
          path: specs[1].endpointSelector.matchLabels
          value:
            k8s:io.kubernetes.pod.namespace: cozy-kubeovn
            k8s:app.kubernetes.io/name: kube-ovn-webhook
            k8s:app.kubernetes.io/instance: kubeovn-webhook
      - contains:
          path: specs[1].ingressDeny[0].fromEntities
          content: world
      - equal:
          path: specs[1].ingressDeny[0].toPorts[0].ports[0].port
          value: "8443"
      - notExists:
          path: specs[1].endpointSelector.matchExpressions

  - it: does not enable default deny on source or target endpoints
    asserts:
      - equal:
          path: specs[0].enableDefaultDeny
          value:
            ingress: false
            egress: false
      - equal:
          path: specs[1].enableDefaultDeny
          value:
            ingress: false
            egress: false
      - notExists:
          path: specs[0].ingress
      - notExists:
          path: specs[0].ingressDeny
      - notExists:
          path: specs[0].egress

  - it: gives each release a cluster-scoped collision-safe name
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^kube-ovn-webhook-[a-f0-9]{12}$
      - notExists:
          path: metadata.namespace

  - it: can be disabled where no Cilium is present to enforce it
    set:
      webhookPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
