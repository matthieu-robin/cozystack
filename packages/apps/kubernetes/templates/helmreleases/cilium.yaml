{{- define "cozystack.defaultCiliumValues" -}}
{{- /* Cilium runs hostNetwork on the Talos worker nodes and resolves the
       apiserver via the worker's /etc/hosts, which the kubernetes-nodes
       chart's talos-reconcile Job seeds with the Kamaji Service ClusterIP
       under <release>.<ns>.svc through machine.network.extraHostEntries
       (workers only exist through pools, so every node Cilium runs on has
       the entry). So a plain DNS host works here without a
       lookup-and-reuse race: the cert covers the same DNS name from chart
       render time, and the hosts entry is set well before kubelet (and
       therefore Cilium) comes up on the node. */}}
cilium:
  k8sServiceHost: {{ printf "%s.%s.svc" .Release.Name .Release.Namespace }}
  k8sServicePort: 6443
  routingMode: tunnel
  MTU: 1350
  enableIPv4Masquerade: true
  ipv4NativeRoutingCIDR: ""
  {{- if $.Values.addons.gatewayAPI.enabled }}
  gatewayAPI:
    enabled: true
    # Without ALPN "h2" on the TLS listener, browsers silently downgrade every
    # Gateway request to HTTP/1.1 (they negotiate HTTP/2 only via ALPN).
    # Frontend hop only; backends stay HTTP/1.1 unless their Service declares
    # appProtocol kubernetes.io/h2c (GEP-1911). Per-cluster opt-out:
    # addons.cilium.valuesOverride.cilium.gatewayAPI.enableAlpn=false.
    enableAlpn: true
  envoy:
    enabled: true
  {{- end }}
{{- end }}

{{- if .Values._namespace.etcd }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-cilium
  labels:
    cozystack.io/repository: system
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  releaseName: cilium
  chartRef:
    kind: ExternalArtifact
    name: cozystack-kubernetes-application-kubevirt-kubernetes-cilium
    namespace: cozy-system
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-admin-kubeconfig
      key: super-admin.svc
  targetNamespace: cozy-cilium
  storageNamespace: cozy-cilium
  interval: 5m
  timeout: 10m
  {{- /* Flux's default install strategy remediates a failed install by
         uninstalling the release, which takes the tenant's only CNI away
         between attempts. RetryOnFailure drops that teardown: the manifests
         stay applied and the failed install is retried as an upgrade. Both
         actions carry the strategy because that retry runs as an upgrade and
         would otherwise fall back to upgrade remediation. The cost is that a
         genuine upgrade failure no longer rolls back either, which is forced,
         since the controller cannot tell a retried install from a real one,
         and what it replaces was an unbounded rollback-and-retry flap. This
         removes an amplifier, not a cause: an install that outruns its budget
         because no node has registered yet stays a problem. The remediation
         blocks cover the branches no strategy reaches, an absent release for
         install and an out-of-sync one for upgrade, so retries: -1 stays. */}}
  install:
    createNamespace: true
    strategy:
      name: RetryOnFailure
      retryInterval: 30s
    remediation:
      retries: -1
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 30s
    remediation:
      retries: -1
  values:
    {{- toYaml (deepCopy .Values.addons.cilium.valuesOverride | mergeOverwrite (fromYaml (include "cozystack.defaultCiliumValues" .))) | nindent 4 }}
  {{- if $.Values.addons.gatewayAPI.enabled }}
  dependsOn:
  - name: {{ .Release.Name }}-gateway-api-crds
    namespace: {{ .Release.Namespace }}
  {{- end }}

{{- /*
addons.cilium.valuesOverride is x-kubernetes-preserve-unknown-fields, so a
tenant can set cilium.kubeProxyReplacement: false for its own cluster. That is
the one path by which the value reaches a live cluster without a cozystack
commit, and it is the path the guest cluster's own ingress-nginx admission deny
depends on: that policy names the webhook backend port only, which covers a pod
dialling the ClusterIP solely because Cilium performs the service DNAT ahead of
its own egress hook. Override it and pods inside the guest cluster regain the
ClusterIP path to the admission webhook while the backend deny keeps working --
no failure, no log line, and the rendered policy unchanged.

The mismatch is detectable here rather than in the guest cluster, because this
HelmRelease's values are assembled on the management cluster, so the beacon is
emitted next to the release that carries the override. Same mechanism and same
reasoning as the -awaiting-etcd beacon in ../cluster.yaml: a ConfigMap an
operator and an alert can both see, not a fail() that would take the tenant's
only CNI down over a weakened defence-in-depth control.

Absence is not a warning: the value is unset in both the override and
cozystack.defaultCiliumValues on every supported path, and the cilium chart's
own values.yaml then supplies true. Only an explicit non-true value fires.
*/}}
{{- $merged := deepCopy .Values.addons.cilium.valuesOverride | mergeOverwrite (fromYaml (include "cozystack.defaultCiliumValues" .)) }}
{{- $mergedCilium := dig "cilium" dict $merged }}
{{- $kpr := dig "kubeProxyReplacement" "" $mergedCilium }}
{{- if and (ne (toString $kpr) "") (ne (toString $kpr) "true") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-cilium-kube-proxy-replacement-off
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: kubernetes
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  status: "kube-proxy-replacement-off"
  kubeProxyReplacement: {{ toString $kpr | quote }}
  message: |
    addons.cilium.valuesOverride sets cilium.kubeProxyReplacement to
    {{ toString $kpr | quote }} for cluster {{ .Release.Name }}.

    Cilium in that guest cluster will not perform the ClusterIP DNAT ahead of
    its own egress hook, so the admission-webhook deny the guest cluster's
    ingress-nginx ships no longer covers traffic addressed to the webhook
    Service ClusterIP. Pods in the guest cluster can reach
    <webhook>.<namespace>.svc:443; the webhook's backend port stays denied.

    This is a deliberate override, so it is reported rather than refused. Clear
    it to restore the control, or set the guest ingress-nginx addon's
    admissionWebhookPolicy.enabled explicitly so the posture is recorded.
{{- end }}
{{- end }}
