# Chainsaw port of hack/e2e-apps/mongodb.bats ("Create DB MongoDB").
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mongodb
spec:
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mongodb-test
  - podLogs:
      selector: app.kubernetes.io/instance=mongodb-test
      tail: 50
  steps:
  - name: create-mongodb
    try:
    - apply:
        file: mongodb.yaml

  - name: wait-helmrelease-ready
    try:
    - assert:
        timeout: 6m
        resource:
          apiVersion: helm.toolkit.fluxcd.io/v2
          kind: HelmRelease
          metadata:
            name: mongodb-test
          status:
            (conditions[?type == 'Ready']):
            - status: "True"

  - name: verify-service-and-statefulset
    try:
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Service
          metadata:
            name: mongodb-test-rs0
          spec:
            (ports[0].port): 27017
    - assert:
        timeout: 3m
        resource:
          apiVersion: v1
          kind: Endpoints
          metadata:
            name: mongodb-test-rs0
          (subsets[0].addresses[0].ip != null): true
    - assert:
        timeout: 5m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: mongodb-test-rs0
          status:
            readyReplicas: 1

  # The ApplicationDefinition declares the trust-anchor source by name
  # (<release>-ca-cert, key ca.crt). Nothing else in the repo checks that this
  # is what the operator actually produces: the declaration and any unit
  # fixture would encode the same assumption and so cannot catch each other
  # being wrong. This step is the independent witness — a Percona rename of
  # either the Secret or the key breaks it here rather than silently producing
  # an empty trust anchor.
  - name: verify-ca-cert-source-shape
    try:
    - assert:
        timeout: 5m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mongodb-test-ca-cert
          (data."ca.crt" != null): true

  # The Secrets the operator creates for TLS all carry private key material and
  # must never be reachable by a tenant. The chart tests pin this at render
  # time; this pins the object that is actually deployed.
  #
  # Asserted as an exact list rather than as the absence of forbidden names,
  # because a rule granting `secrets` with no resourceNames at all grants every
  # Secret in the namespace while containing no forbidden name to match on.
  #
  # Two counts are asserted alongside it and neither is redundant. An
  # ADDITIONAL rule naming secrets contributes no entries to the flattened name
  # list, so the equality alone would still hold while every Secret became
  # readable — the secrets-rule count catches that. An ADDED rule with resources
  # ["*"] grants every Secret without containing the string "secrets" at all, so
  # it is invisible to both — the total rule count catches that one. An existing
  # rule MUTATED to ["*"] drops the secrets-rule count to zero and empties the
  # flattened name list, so both assertions below fail on it as well.
  - name: verify-tenant-role-grants-no-key-material
    try:
    - assert:
        timeout: 2m
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: mongodb-test-dashboard-resources
          (length(rules)): 3
          (length(rules[?contains(resources, 'secrets')])): 1
          (rules[?contains(resources, 'secrets')].resourceNames[]):
          - mongodb-test-credentials
          # The Role is read-only by intent; verbs is the fourth RBAC axis and
          # widening it is the same class as widening the other three.
          (length(rules[?verbs != ['get', 'list', 'watch']])): 0

  # The Role above is only one of the two paths a Secret can reach a tenant by.
  # The other is core.cozystack.io/tenantsecrets, which surfaces whatever the
  # lineage webhook stamped internal.cozystack.io/tenantresource=true from this
  # application's ApplicationDefinition selectors. That is the path the
  # secrets.include selector drives, and it is the one that would leak the CA
  # private key if the selector ever named the operator's Secrets instead of
  # the projection. Assert the key-bearing Secrets are not promoted onto it.
  #
  # This negative holds today and does not depend on the CA-extraction
  # controller: it asserts what must NOT be labelled, not that the projection
  # exists. Written as != 'true' rather than == 'false' because the stamp is
  # applied when the operator adds its ownerReference, so before that pass the
  # label is absent rather than false — both states are correct here.
  - name: verify-key-bearing-secrets-are-not-tenant-secrets
    try:
    # Positive control, and it must come first. The three negatives below are
    # satisfied by an ABSENT label — which is also exactly what you observe if
    # the lineage webhook never stamped anything in this run at all, because a
    # field was renamed or the kind was not reconciled. Without a witness that
    # the mechanism is live, all three would pass while asserting nothing about
    # the CA private key.
    #
    # The credentials Secret is the right witness: the chart renders it, it
    # traces to the MongoDB CR, and the ApplicationDefinition grants it by name
    # — so it MUST be stamped. This also catches the regression the exclude
    # list makes newly possible, since exclude is evaluated before include and
    # would silently revoke the tenant's own connection string.
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mongodb-test-credentials
            labels:
              internal.cozystack.io/tenantresource: "true"
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mongodb-test-ca-cert
          (metadata.labels."internal.cozystack.io/tenantresource" != 'true'): true
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mongodb-test-ssl
          (metadata.labels."internal.cozystack.io/tenantresource" != 'true'): true
    # All three are enumerated deliberately. The promotion is driven by a label
    # selector rather than by name, so any one of them acquiring the label
    # leaks a key — witnessing two of the three would leave the third unguarded.
    - assert:
        timeout: 2m
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mongodb-test-ssl-internal
          (metadata.labels."internal.cozystack.io/tenantresource" != 'true'): true

  # The -old snapshots are operator scratch state that the operator removes
  # itself once the merged CA has landed, not residue needing manual cleanup.
  # A settled install must therefore leave none behind. This is a weak witness
  # on first install, where they are never created at all, but it pins the
  # corrected claim and goes red if the operator stops cleaning up.
  - name: verify-no-rotation-snapshots-remain
    try:
    - error:
        # Short: a Secret that does not exist will not start existing while
        # chainsaw waits, and this step is a weak witness on a first install.
        timeout: 30s
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mongodb-test-ssl-old
    - error:
        timeout: 30s
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mongodb-test-ssl-internal-old
---
# Logical-dump backup half of the MongoDB backup flow, driving the validated
# example scripts (examples/backups/mongodb) as the harness so the test and the
# documented flow can never drift. run-all.sh runs Bucket -> source MongoDB
# (backup.enabled) + sentinel document -> ad-hoc BackupJob against the
# cozy-default BackupClass (waits Succeeded), and SKIP_RESTORE=1 stops it there
# — the in-cluster witness that a psmdb-operator backup is actually taken.
#
# The to-copy restore half is deliberately uncovered. A to-copy restore replays
# the source cluster's system users into the target, so the target's own
# generated credentials stop authenticating and the harness cannot read the
# sentinel back out of the restored copy (#3832). Returning full round-trip
# coverage once that is fixed means dropping both SKIP_RESTORE below and the
# marker check beside it: the complete flow never prints that line, so removing
# only the variable trades this failure for a marker mismatch. The test keeps
# its round-trip name for that return.
#
# Same harness-driving shape as mariadb-2-backup-roundtrip
# (hack/e2e-chainsaw/mariadb/chainsaw-test.yaml): a single run step pre-cleans
# any leftover state, drives run-all.sh, and drains in an always-reached finally.
#
# Runs in tenant-root, not the default tenant-test: the S3 client here is the
# percona-backup-mongodb agent INSIDE the mongod pod, and the e2e tenant is
# created isolated (hack/e2e-install-cozystack.bats) — its Cilium egress
# allowlist blocks a tenant-test Pod from reaching tenant-root's seaweedfs,
# while a tenant-root Pod reaches it over same-tenant egress. The harness
# targets the in-cluster endpoint (S3_ENDPOINT below) instead of the BucketInfo
# external ingress URL, which in CI is an unroutable placeholder, and tolerates
# its self-signed cert via backup.insecureSkipTLSVerify=true on the app (the
# psmdb s3 storage has no CA-bundle field, unlike the mariadb driver's tls
# block).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mongodb-2-backup-roundtrip
spec:
  namespace: tenant-root
  skipDelete: true
  catch:
  - events: {}
  - describe:
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: mongodb-mongodb-src
  - describe:
      apiVersion: psmdb.percona.com/v1
      kind: PerconaServerMongoDB
      name: mongodb-mongodb-src
  - describe:
      apiVersion: psmdb.percona.com/v1
      kind: PerconaServerMongoDBBackup
  - describe:
      apiVersion: psmdb.percona.com/v1
      kind: PerconaServerMongoDBRestore
  - describe:
      apiVersion: backups.cozystack.io/v1alpha1
      kind: BackupJob
  - describe:
      apiVersion: backups.cozystack.io/v1alpha1
      kind: RestoreJob
  # The dump/restore runs in the pbm agent inside the mongod pods; a failed
  # upload or TLS handshake leaves its error in those Pods' logs.
  - podLogs:
      selector: app.kubernetes.io/instance=mongodb-mongodb-src
      tail: 200
  steps:
  - name: run
    try:
    # Pre-clean: tenant-root is a shared, persistent namespace with fixed
    # resource names, so a run killed before the finally below leaves stale
    # state behind. A leftover BackupJob still carrying status.phase=Succeeded
    # from a prior run would satisfy `wait_for_field ... Succeeded` instantly
    # and pass without a real backup ever running. cleanup.sh is idempotent
    # (--ignore-not-found), so this is a no-op on a clean namespace.
    - script:
        timeout: 8m
        content: |
          set -eu
          cd ../../..
          NAMESPACE="$NAMESPACE" examples/backups/mongodb/cleanup.sh
        check:
          ($error == null): true
    # The 30m budget covers what this step drives: bucket provisioning, a
    # single-replica source MongoDB coming up (psmdb reconcile, PVC bind, image
    # pull, pbm-agent sidecars) and the logical dump to S3 (convention 6:
    # justified in-line). It is not lowered for the skipped restore because
    # run-all.sh's own per-wait budgets up to the backup already exceed it, so
    # this is the ceiling that fires either way. run-all.sh fails fast on a
    # terminal BackupJob phase and stalled HelmReleases rather than polling out
    # the budget.
    - script:
        timeout: 30m
        content: |
          set -eu
          cd ../../..
          [ -x examples/backups/mongodb/run-all.sh ] || { echo "mongodb backup example scripts not found at examples/backups/mongodb" >&2; exit 1; }
          NAMESPACE="$NAMESPACE" S3_ENDPOINT="https://seaweedfs-s3.tenant-root:8333" \
            SKIP_RESTORE=1 examples/backups/mongodb/run-all.sh
        check:
          ($error == null): true
          # Exit zero alone is also what a completed round-trip returns, so the
          # marker is what tells the skipped flow from the full one — and what
          # fails the step if SKIP_RESTORE stops reaching the harness. run-all.sh
          # logs through stderr. The phrase is the skip branch's own line, minus
          # its colon, which YAML would read as a mapping separator in the key.
          (contains($stderr, 'stopping after a successful backup')): true
    finally:
    # Removes every resource the harness created (chainsaw did not apply them,
    # so they are not part of automatic cleanup) — including the operator-side
    # psmdb.percona.com Backup/Restore CRs the Cozystack jobs own only by label.
    - description: backup-flow cleanup
      script:
        timeout: 8m
        content: |
          set -eu
          cd ../../..
          NAMESPACE="$NAMESPACE" examples/backups/mongodb/cleanup.sh
